<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>FPV DVR</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <script defer type="text/javascript" src="{{ url_for('static', filename='scripts.js') }}"></script>

    <div id="container">

        <div id="video-container">

            <!--
                Placeholder for now.

                The next iteration will put the actual
                segment playback here.
            -->

            <video id="video" controls></video>

        </div>


        <div id="controls">

            <div id="timeline-container">

                <div id="timeline"></div>

                <div id="quality-bar"></div>

                <div id="position"></div>

                <div id="live-marker"></div>

            </div>


            <div id="labels">

                <span id="start-time">00:00</span>

                <span id="current-time">00:00</span>

                <span id="end-time">LIVE</span>

            </div>


            <div id="buttons">

                <button onclick="goLive()">
                    LIVE
                </button>

                <button onclick="jumpBack(30)">
                    -30 sec
                </button>

                <button onclick="jumpBack(60)">
                    -1 min
                </button>

            </div>


            <div id="status">

                <span id="buffer-status">
                    Buffer: 0:00
                </span>

                <span id="signal">
                    Signal: --
                </span>

            </div>

        </div>

    </div>

</body>

</html>
